<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Laweta WARSHOL na trasie</title>
  <desc id="desc">Stylizowana ilustracja czerwonej lawety jadącej nocą po drodze.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="60%" stop-color="#0b0b0b" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b1b1b" />
      <stop offset="50%" stop-color="#101010" />
      <stop offset="100%" stop-color="#1b1b1b" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3dd7ff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f5d78" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />

  <g opacity="0.5">
    <circle cx="150" cy="120" r="80" fill="#222" />
    <circle cx="980" cy="90" r="120" fill="#1c1c1c" />
    <circle cx="620" cy="200" r="140" fill="#191919" />
  </g>

  <rect x="0" y="560" width="1200" height="180" fill="url(#road)" />
  <rect x="0" y="618" width="1200" height="8" fill="#2c2c2c" />
  <rect x="0" y="665" width="1200" height="6" fill="#2c2c2c" />

  <g stroke="#ff3c3c" stroke-width="12" stroke-linecap="round" opacity="0.45">
    <line x1="100" y1="520" x2="320" y2="520" />
    <line x1="480" y1="520" x2="760" y2="520" />
    <line x1="900" y1="520" x2="1140" y2="520" />
  </g>

  <g filter="url(#glow)">
    <rect x="210" y="360" width="660" height="180" rx="24" fill="#171717" stroke="#ff2d2d" stroke-width="10" />
    <rect x="220" y="390" width="520" height="120" rx="16" fill="#101010" stroke="#2a2a2a" stroke-width="6" />
    <rect x="230" y="400" width="280" height="100" rx="14" fill="url(#glass)" />
    <rect x="520" y="400" width="200" height="100" rx="12" fill="#161616" stroke="#2a2a2a" stroke-width="4" />
    <rect x="750" y="380" width="80" height="140" rx="16" fill="#111" stroke="#ff2d2d" stroke-width="8" />

    <rect x="420" y="440" width="18" height="70" fill="#2d2d2d" />
    <rect x="450" y="430" width="18" height="80" fill="#2d2d2d" />
    <rect x="480" y="420" width="18" height="90" fill="#2d2d2d" />

    <rect x="780" y="350" width="20" height="30" fill="#ff5f1f" />
    <rect x="815" y="350" width="20" height="30" fill="#ff5f1f" />
  </g>

  <g>
    <circle cx="340" cy="550" r="58" fill="#0d0d0d" stroke="#2d2d2d" stroke-width="12" />
    <circle cx="340" cy="550" r="26" fill="#ff2d2d" />
    <circle cx="760" cy="550" r="58" fill="#0d0d0d" stroke="#2d2d2d" stroke-width="12" />
    <circle cx="760" cy="550" r="26" fill="#ff2d2d" />
  </g>

  <g>
    <rect x="210" y="470" width="520" height="26" fill="#ff3c3c" />
    <rect x="730" y="470" width="70" height="26" fill="#e8e8e8" />
    <rect x="820" y="500" width="60" height="20" fill="#ff8b00" />
    <rect x="200" y="500" width="40" height="20" fill="#ffd15c" />
  </g>

  <g opacity="0.85">
    <rect x="630" y="345" width="16" height="150" fill="#ff2d2d" />
    <rect x="646" y="345" width="16" height="150" fill="#d92222" />
    <rect x="662" y="345" width="16" height="150" fill="#b71b1b" />
    <rect x="678" y="345" width="16" height="150" fill="#8a1313" />
  </g>

  <text x="240" y="520" fill="#f5f5f5" font-family="'Inter', 'Segoe UI', Arial" font-size="28" font-weight="800" letter-spacing="1">
    WARSHOL · LAWETA 24/7
  </text>
</svg>
